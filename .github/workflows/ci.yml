# Continuous integration for the iShot redesign: front-end build + design-token lint, PHP coding
# standards + static analysis, and the full PHPUnit suite (incl. the 50-process booking concurrency
# test) against real WordPress + MySQL via @wordpress/env.
#
# Isolation: read-only token, no secrets, no deployments, no artifacts uploaded (nothing that could
# carry data out of the run). Test data is generated by the tests themselves (example.com addresses).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["redesign/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PHP_VERSION: "8.2"

jobs:
  frontend:
    name: Front-end build + design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `build` runs `sync:ds` (regenerates tokens, theme.json, fonts) and `lint:tokens` first.
      - run: npm run build
      - name: Generated design-system files are committed and up to date
        run: git diff --exit-code -- wordpress/wp-content/themes/ishot-concept wordpress/wp-content/plugins/ishot-booking/assets
      # Rebuilds every block package into a temp folder and byte-compares it with the committed build/.
      # Passes trivially (and says so) while there are no blocks.
      - name: Built blocks are committed and up to date
        run: npm run build:blocks:check
      # Report-only: the remaining advisories need major upgrades of dev tooling
      # (docs/dependency-remediation.md). Never blocks, never upgrades anything.
      - name: npm audit (report only)
        run: npm audit --omit=optional || true

  script-tests:
    name: Build and visual-harness script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium
      # Unit tests only: build-blocks.mjs against temp fixture packages and the visual harness's
      # comparison helpers. The full visual reference run is a local, owner-triggered task, not CI.
      - run: node --test tests/blocks/*.test.mjs tests/visual/*.test.mjs tests/dev/*.test.mjs

  php-quality:
    name: PHPCS (WPCS + PHPCompatibility) + PHPStan level 6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
      # PHPStan scans Action Scheduler from the plugin's own vendor directory.
      - name: Plugin dependencies
        working-directory: wordpress/wp-content/plugins/ishot-booking
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: QA tools
        working-directory: tools/qa
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS
        working-directory: tools/qa
        run: vendor/bin/phpcs --standard=phpcs.xml.dist -q --report=full --report-summary
      - name: PHPStan
        working-directory: tools/qa
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --memory-limit=1G --error-format=github

  php-tests:
    name: PHPUnit (WordPress + MySQL via wp-env)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start WordPress test environment
        run: npx wp-env start
      - name: Plugin dependencies, ishot-booking and ishot-blocks (inside the test container)
        run: npm run wp:setup
      - name: PHPUnit ishot-booking (unit + integration, incl. concurrency)
        run: npm run test:php
      - name: PHPUnit ishot-blocks (unit + integration)
        run: npm run test:blocks
      - name: PHPUnit theme suite (theme active, both plugins loaded)
        run: npm run test:theme
      - name: Stop environment
        if: always()
        run: npx wp-env stop || true
